name: macOS installer validation

# Do not path-filter a required check: CI/security-only PRs need these tests too.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-package-tests:
    name: Swift installer-domain tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify native Apple Silicon macOS 26 runner and record toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test -n "$COVERAGE_BASE_SHA"
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - name: Exercise CI-gate unit and subprocess integration regressions
        run: python3 tests/foundation/test_ci_gate_regressions.py
      - name: Run native installer tests with coverage
        working-directory: macos/ForgePlatformInstaller
        env:
          FORGE_PLATFORM_UI_ARTIFACT_DIR: ${{ runner.temp }}/forge-platform-ui-screenshots
        run: swift test --enable-code-coverage
      - name: Enforce every changed production-file coverage
        working-directory: macos/ForgePlatformInstaller
        run: |
          set -euo pipefail
          coverage_path="$(swift test --show-codecov-path)"
          test -n "$coverage_path"
          python3 ../../scripts/check_managed_installer_swift_coverage.py "$coverage_path" \
            --minimum 80.2 --base-ref "$COVERAGE_BASE_SHA"
      - name: Upload read-only native UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-platform-read-only-ui-${{ github.sha }}
          path: ${{ runner.temp }}/forge-platform-ui-screenshots
          if-no-files-found: error
          retention-days: 14
